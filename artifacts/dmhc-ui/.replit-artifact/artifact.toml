kind = "web"
previewPath = "/"
title = "DMHC-EM — CNC Middleware"
version = "1.0.0"
id = "artifacts/dmhc-ui"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25308

[services.development]
run = "pnpm --filter @workspace/dmhc-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dmhc-ui", "run", "build" ]
serve = "static"
publicDir = "artifacts/dmhc-ui/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25308"
BASE_PATH = "/"
